[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Structure-aware, agentic codebase intelligence: AST retrieval, code graph, verified citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.26.0 returns corrupted Node objects (garbage positions, then an access violation) when
    # nodes from `named_children` are read more than once; 0.25.2 does not. Re-test before bumping.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.16",
    "mypy>=2",
    "types-PyYAML",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "flask: needs the pinned Flask checkout (set CODEATLAS_FLASK_REPO); skipped otherwise",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Fixtures are inputs to the parser tests: their exact text and line numbers are asserted.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
